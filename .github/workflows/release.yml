name: Release

on:
  push:
    branches: [ master ]
    paths:
      - 'release-assets/Emerald3DS-PTBR-v0.4.0-ptbr-02.zip'
      - '.github/workflows/release.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove release anterior
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete v0.4.0-ptbr-01 --yes --cleanup-tag || true
      - name: Publicar release completo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.4.0-ptbr-02 \
            "release-assets/Emerald3DS-PTBR-v0.4.0-ptbr-02.zip" \
            --title "Emerald3DS PT-BR completo (v0.4.0-ptbr-02)" \
            --notes-file release-assets/NOTES.md \
            --verify-tag
